# Writes a TestFlight build's "What to Test" notes from git.
#
# Runs two ways:
#
#   - Called by `testflight` and `release` after their iOS upload. It waits for
#     Apple to finish processing, which takes 5-20 minutes, so it is a separate
#     job rather than a step: the caller's build job finishes immediately and
#     `publish-release` is not held up behind Apple's processing queue.
#
#   - Dispatched manually, to rewrite notes for a build that is already in
#     TestFlight. The notes step is non-fatal in both callers, so a failure
#     leaves a good build with empty notes; this rewrites them without
#     rebuilding — no Xcode, no Rust, no archive, so about a minute.
#
# On the manual path the archive is long gone, so provenance can't be recovered
# from it: pass `sha` whenever the branch has moved since the build, or the notes
# will name whatever that ref points at today.
name: testflight-notes

on:
  workflow_call:
    inputs:
      build_number:
        type: string
        required: false
        default: ""
      newest:
        type: boolean
        required: false
        default: false
      ref:
        type: string
        required: false
        default: "main"
      sha:
        type: string
        required: false
        default: ""
      non_fatal:
        # Callers set this: by the time notes are written the IPA is already in
        # TestFlight, so a notes failure must not fail their build. Left false on
        # the manual path, where a failed retry should be loud.
        type: boolean
        required: false
        default: false
  workflow_dispatch:
    inputs:
      build_number:
        description: "CFBundleVersion of the build to write notes for"
        type: string
        required: false
        default: ""
      newest:
        description: "Target the most recently uploaded build instead (ignores build_number)"
        type: boolean
        required: false
        default: false
      ref:
        description: "Branch or tag that was built — sources the commit list"
        type: string
        required: false
        default: "main"
      sha:
        description: "Short SHA that was built (defaults to the tip of ref)"
        type: string
        required: false
        default: ""

permissions:
  contents: read

jobs:
  write-notes:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}
          # Enough history for the commit list; the default depth of 1 would
          # leave it with a single subject.
          fetch-depth: 50

      - name: Set up App Store Connect API key
        env:
          API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
          API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$API_KEY" | base64 --decode > "$HOME/.appstoreconnect/private_keys/AuthKey_${API_KEY_ID}.p8"

      - name: Write TestFlight release notes
        continue-on-error: ${{ inputs.non_fatal }}
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          NOTES_BRANCH: ${{ inputs.ref }}
          NOTES_SHA: ${{ inputs.sha }}
          BUILD_NUMBER: ${{ inputs.build_number }}
          NEWEST: ${{ inputs.newest }}
        run: |
          if ! python3 -c 'import cryptography' 2>/dev/null; then
            # The first attempt fails noisily under PEP 668; keep that out of the
            # log, since the --break-system-packages retry is the expected path.
            python3 -m pip install --quiet --disable-pip-version-check cryptography 2>/dev/null \
              || python3 -m pip install --quiet --disable-pip-version-check \
                   --break-system-packages cryptography
          fi
          ARGS=(--bundle-id app.biblemarker --branch "$NOTES_BRANCH")
          if [ -n "$NOTES_SHA" ]; then
            ARGS+=(--sha "$NOTES_SHA")
          fi
          # The script rejects the case where neither is supplied, rather than
          # quietly stamping this run's provenance onto an unrelated build.
          if [ "$NEWEST" = "true" ]; then
            ARGS+=(--newest)
          elif [ -n "$BUILD_NUMBER" ]; then
            ARGS+=(--build-number "$BUILD_NUMBER")
          fi
          python3 scripts/testflight-notes.py "${ARGS[@]}"
