name: testflight

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch or tag to build from"
        required: false
        default: "main"

permissions:
  contents: read

jobs:
  build-ios:
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}
          # Enough history for the commit list in the TestFlight release notes;
          # the default depth of 1 would leave it with a single subject.
          fetch-depth: 50

      - name: Download SWORD modules
        run: |
          gh release download v1.0.0 --repo spearssoftware/biblemarker-assets --dir src-tauri/resources --pattern "sword-*.zip"
        env:
          GH_TOKEN: ${{ secrets.BIBLEMARKER_ASSETS_TOKEN }}

      - name: Download gnosis-lite.db
        run: |
          gh release download v0.9.3 --repo spearssoftware/gnosis --dir src-tauri/resources --pattern "gnosis-lite.db"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Select Xcode 26.2
        run: sudo xcode-select -s /Applications/Xcode_26.2.app

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "lts/*"
          cache: "pnpm"

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        continue-on-error: true
        with:
          workspaces: "./src-tauri -> target"

      - name: Install frontend dependencies
        run: pnpm install

      - name: Set up App Store Connect API key
        env:
          API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
          API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$API_KEY" | base64 --decode > ~/.appstoreconnect/private_keys/AuthKey_${API_KEY_ID}.p8

      - name: Initialize iOS project
        run: pnpm tauri ios init
        env:
          CI: true

      - name: Generate icons
        run: pnpm tauri icon public/icon.svg

      - name: Strip alpha from iOS icons
        run: |
          node -e "
          const sharp = require('sharp');
          const fs = require('fs');
          const path = require('path');
          const dir = 'src-tauri/gen/apple/Assets.xcassets/AppIcon.appiconset';
          const files = fs.readdirSync(dir).filter(f => f.endsWith('.png'));
          Promise.all(files.map(async f => {
            const p = path.join(dir, f);
            const buf = await sharp(p).flatten({ background: { r: 16, g: 30, b: 63 } }).png().toBuffer();
            fs.writeFileSync(p, buf);
          })).then(() => console.log('Stripped alpha from', files.length, 'icons'));
          "

      # iCloud sync was removed in 3.1.0 (HTTP sync is the default), so we keep the
      # default entitlements from `tauri ios init` — no iCloud capability. Injecting
      # iCloud entitlements here would force automatic signing to build a profile the
      # App ID no longer supports, which breaks signing.

      - name: Declare no non-exempt encryption
        run: |
          PLIST=src-tauri/gen/apple/biblemarker_iOS/Info.plist
          plutil -replace ITSAppUsesNonExemptEncryption -bool false "$PLIST" 2>/dev/null || \
          plutil -insert ITSAppUsesNonExemptEncryption -bool false "$PLIST"

      - name: Patch Xcode project for Xcode 26 compatibility
        run: |
          PBXPROJ=src-tauri/gen/apple/biblemarker.xcodeproj/project.pbxproj
          sed -i '' 's/IPHONEOS_DEPLOYMENT_TARGET = 14.0/IPHONEOS_DEPLOYMENT_TARGET = 17.0/g' "$PBXPROJ"
          python3 -c '
          path = "src-tauri/gen/apple/biblemarker.xcodeproj/project.pbxproj"
          with open(path) as f:
              content = f.read()
          content = content.replace(
              "ENABLE_BITCODE = NO;",
              "ENABLE_BITCODE = NO;\n\t\t\t\tOTHER_LDFLAGS = \"$(inherited) -Wl,-U,__swift_FORCE_LOAD_$_swiftCompatibility56 -Wl,-U,__swift_FORCE_LOAD_$_swiftCompatibilityConcurrency -Wl,-U,__swift_FORCE_LOAD_$_swiftCompatibilityPacks\";"
          )
          with open(path, "w") as f:
              f.write(content)
          '

      # Unique, increasing CFBundleVersion per build (epoch minutes) so every
      # TestFlight upload of the same app version is a distinct build — otherwise
      # App Store Connect rejects a re-upload with "bundle version already used".
      - name: Build iOS app
        run: |
          # Xcode's Rust build phase doesn't inherit step env vars (tauri#13856),
          # so write the NASB key to a file build.rs reads to embed it.
          printf '%s' "$NASB_SIGNING_KEY" > src-tauri/nasb_signing_key.txt
          # Epoch minutes (matches release.yml + the Android versionCode scheme).
          BUILD_NUMBER=$(( $(date +%s) / 60 ))
          echo "CFBundleVersion (build number): $BUILD_NUMBER"
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> "$GITHUB_ENV"
          # Capture provenance now, at archive time. The notes are written many
          # minutes later, after processing finishes, and must describe the tree
          # that was actually built.
          {
            printf '%s @ %s  (build %s)\n\n' \
              "$NOTES_BRANCH" "$(git rev-parse --short HEAD)" "$BUILD_NUMBER"
            printf 'Recent commits:\n'
            git log -10 --no-merges --pretty=format:'- %s'
          } > "$RUNNER_TEMP/tf-notes.txt"
          printf '{"bundle":{"iOS":{"bundleVersion":"%s"}}}' "$BUILD_NUMBER" > "$RUNNER_TEMP/bundle-version.json"
          pnpm tauri ios build --export-method app-store-connect --config "$RUNNER_TEMP/bundle-version.json"
        env:
          CI: true
          NOTES_BRANCH: ${{ inputs.ref }}
          APPLE_DEVELOPMENT_TEAM: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_ISSUER: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APPLE_API_KEY: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APPLE_API_KEY_PATH: ~/.appstoreconnect/private_keys/AuthKey_${{ secrets.APP_STORE_CONNECT_KEY_ID }}.p8
          # Embed the NASB download signing key so TestFlight builds behave like the
          # official app (NASB/NASB95 downloads work); release.yml sets this too.
          NASB_SIGNING_KEY: ${{ secrets.NASB_SIGNING_KEY }}

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v7
        with:
          name: BibleMarker-iOS
          path: src-tauri/gen/apple/build/**/*.ipa
          if-no-files-found: warn

      - name: Upload to TestFlight
        env:
          API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          IPA_PATH=$(find src-tauri/gen/apple/build -name "*.ipa" | head -1)
          if [ -z "$IPA_PATH" ]; then
            echo "No IPA found, skipping upload"
            exit 1
          fi
          xcrun altool --upload-app \
            --type ios \
            --file "$IPA_PATH" \
            --apiKey "$API_KEY_ID" \
            --apiIssuer "$API_ISSUER_ID"

      # Fill the build's "What to Test" from git, so a build in App Store Connect
      # identifies itself. CFBundleVersion holds only period-separated integers,
      # so the notes are the only place the branch and SHA can live.
      #
      # Non-fatal on purpose: the IPA is already safely in TestFlight by this
      # point, and the notes take ~15 minutes to write because the build has to
      # finish processing first. Run the `testflight-notes` workflow to retry in
      # under a minute without rebuilding.
      - name: Write TestFlight release notes
        continue-on-error: true
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          if ! python3 -c 'import cryptography' 2>/dev/null; then
            python3 -m pip install --quiet --disable-pip-version-check cryptography \
              || python3 -m pip install --quiet --disable-pip-version-check \
                   --break-system-packages cryptography
          fi
          python3 scripts/testflight-notes.py \
            --bundle-id app.biblemarker \
            --build-number "$BUILD_NUMBER" \
            --notes-file "$RUNNER_TEMP/tf-notes.txt"
