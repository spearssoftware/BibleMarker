# Ignored advisories for upstream dependencies we can't fix directly.
# Review periodically — remove once upstream releases patched versions.

[advisories]
ignore = [
    # rsa 0.9.x — Marvin attack. Pinned by tauri-plugin-sql transitive dep.
    "RUSTSEC-2023-0071",
    # sqlx 0.8.x — binary protocol misuse. Pinned by tauri-plugin-sql.
    "RUSTSEC-2024-0363",
    # rkyv 0.7.x — optional dep of rust_decimal (tauri-plugin-sql → sqlx-core).
    # We never enable the feature, so it is in Cargo.lock but absent from
    # `cargo tree -i rkyv --target all` and never compiled into the binary.
    "RUSTSEC-2026-0235",

    # rand — unsound only when a custom logger calls `rand::rng()` on a panicking thread.
    # We don't use rand directly; transitive via quinn → reqwest.
    "RUSTSEC-2026-0097",

    # zip 4.x — `ZipArchive::extract` symlink escape, SUID/SGID preservation.
    # Optional, Windows-only dependency of tauri-plugin-updater, which still requires
    # zip ^4 as of 2.14.0 (zip 9 is on the unreleased v2 branch). All three advisories
    # need extraction of an untrusted archive: the updater verifies the minisign
    # signature against the pubkey in tauri.conf.json before extracting, and SUID/SGID
    # bits do not exist on Windows. Remove once the plugin releases against zip 9.
    "RUSTSEC-2026-0367",
    "RUSTSEC-2026-0368",
    "RUSTSEC-2026-0369",

    # glib VariantStrIter unsoundness — transitive via Tauri's GTK3 stack (Linux only).
    "RUSTSEC-2024-0429",

    # gtk-rs GTK3 bindings — unmaintained. Tauri 2 still uses GTK3 on Linux; upgrade path
    # is GTK4 via webkit2gtk, pending Tauri ecosystem migration.
    "RUSTSEC-2024-0411", # gdkwayland-sys
    "RUSTSEC-2024-0412", # gdk
    "RUSTSEC-2024-0413", # atk
    "RUSTSEC-2024-0414", # gdkx11-sys
    "RUSTSEC-2024-0415", # gtk
    "RUSTSEC-2024-0416", # atk-sys
    "RUSTSEC-2024-0417", # gdkx11
    "RUSTSEC-2024-0418", # gdk-sys
    "RUSTSEC-2024-0419", # gtk3-macros
    "RUSTSEC-2024-0420", # gtk-sys

    # Unmaintained proc-macro / utility crates, transitive via Tauri's macro stack.
    "RUSTSEC-2024-0370", # proc-macro-error
    "RUSTSEC-2024-0436", # paste
    "RUSTSEC-2025-0057", # fxhash

    # Unmaintained unic-* unicode crates, transitive via idna / Tauri.
    "RUSTSEC-2025-0075", # unic-char-range
    "RUSTSEC-2025-0080", # unic-common
    "RUSTSEC-2025-0081", # unic-char-property
    "RUSTSEC-2025-0098", # unic-ucd-version
    "RUSTSEC-2025-0100", # unic-ucd-ident
]
